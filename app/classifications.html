<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Insights | Classification</title><style>body{font:15px system-ui;background:#0b1220;color:#e6edf8;max-width:1150px;margin:30px auto;padding:0 22px}a{color:#93c5fd}.muted{color:#a6b8d0}.panel{background:#172236;border:1px solid #35465e;padding:24px;border-radius:14px;margin:22px 0}input,select{background:#0c1829;color:white;border:1px solid #435773;border-radius:8px;padding:11px;width:100%;box-sizing:border-box}label{display:grid;gap:7px;font-size:13px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;text-align:left;border-bottom:1px solid #35445c}th{color:#a7b9d1}#error{color:#fca5a5}@media(max-width:700px){.fields{grid-template-columns:1fr}.panel{overflow:auto}}</style><a href="/">← Industry Explorer</a><h1>Industry classification</h1><p class="muted">Evidence-based, independently stored classification. No automated assumptions about a company's industry.</p><div id="editor" class="panel" hidden><h2>Add or review classification</h2><form id="form"><div class="fields"><label>Company name<input name="company_name" required minlength="2" maxlength="200"></label><label>Industry<input name="industry" required minlength="2" maxlength="100" placeholder="e.g. Electronics manufacturing"></label><label>Confidence<select name="confidence"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label><label>Evidence/source<input name="source" required minlength="3" maxlength="500" placeholder="Reference document, website or verified note"></label></div><p><label><input type="checkbox" name="approved" style="width:auto"> Approved by administrator</label></p><button>Save classification</button></form></div><div class="panel"><h2>Classification register</h2><input id="q" placeholder="Search company names" maxlength="100"><button id="search">Search</button><p id="error"></p><table><thead><tr><th>Company</th><th>Industry</th><th>Confidence</th><th>Approval</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></div><script>
const $=id=>document.getElementById(id);async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function load(){try{$('error').textContent='';const d=await api('/api/classifications?q='+encodeURIComponent($('q').value));$('rows').replaceChildren();for(const v of d.results){const tr=document.createElement('tr');for(const t of [v.company_name,v.industry,v.confidence,v.approved?'Approved':'Pending review',v.source]){const td=document.createElement('td');td.textContent=t;tr.append(td)}$('rows').append(tr)}if(!d.results.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=5;td.textContent='No classifications recorded yet';tr.append(td);$('rows').append(tr)}}catch(e){$('error').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();const f=e.target,d=new FormData(f);try{await api('/api/admin/classifications','POST',{company_name:d.get('company_name'),industry:d.get('industry'),confidence:d.get('confidence'),source:d.get('source'),approved:d.has('approved')});f.reset();await load()}catch(e){$('error').textContent=e.message}};$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};api('/auth/me').then(u=>{if(u.role==='admin')$('editor').hidden=false;load()}).catch(()=>{$('error').textContent='Please sign in first'});
</script></html>
