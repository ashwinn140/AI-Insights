<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Insights | Discovery</title><style>:root{font:15px system-ui;color:#e7edf7;background:#0b1220}body{max-width:1200px;margin:30px auto;padding:0 22px}a{color:#93c5fd}.muted{color:#a0b3cf}.panel{background:#162136;border:1px solid #34465f;border-radius:13px;padding:22px;margin:20px 0}input,select{background:#0d1829;border:1px solid #415574;color:white;border-radius:8px;padding:12px;font:inherit}input{min-width:280px}button{background:#2563eb;border:0;border-radius:8px;padding:12px 20px;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #35435a;text-align:left;padding:13px}th{color:#a9bbd4}h1{font-size:32px}#error{color:#fca5a5}</style><link rel="stylesheet" href="/assets/ui.css?v=2"><script src="/assets/ui.js?v=2" defer></script><nav><a href="/classifications">Industry Intelligence</a><a href="/">Operations Overview</a><a href="/companies">Company Explorer</a><a href="/opportunities">Opportunity Finder</a><a href="/admin" id="adminlink" hidden>Administration</a></nav><h1 id="title">Company Explorer</h1><p id="description" class="muted"></p><div class="panel ai-discovery-filters"><h2>Refine your view</h2><label>Company <select id="company"><option value="">All authorized</option></select></label> &nbsp; <label>Department <select id="lob"><option value="">All authorized</option></select></label><p><label>Origin <select id="origin"><option value="">All origins</option></select></label> &nbsp; <label>Destination <select id="destination"><option value="">All destinations</option></select></label> &nbsp; <label>Branch <select id="branch"><option value="">All branches</option></select></label></p><p><label>From <input type="date" id="start"></label> &nbsp; <label>To <input type="date" id="end"></label></p><p id="searchwrap"><label for="q">Company name</label><input id="q" placeholder="Search shipper or consignee name" maxlength="100"> <button id="search">Search</button></p><button id="refresh">Refresh</button> <button id="export">↓ Export Excel</button><p id="error"></p></div><div class="panel ai-discovery-results"><h2 id="tabletitle">Companies</h2><table><thead id="head"></thead><tbody id="rows"></tbody></table><p class="muted" id="note"></p></div><script>
const $=id=>document.getElementById(id);const opportunity=location.pathname.includes('opportunities');$('title').textContent=opportunity?'Opportunity Finder':'Company Explorer';$('description').textContent=opportunity?'Potential commercial research candidates ranked by observed shipment participation and trade-lane breadth. Not confirmed prospects.':'Find shipper and consignee appearances in authorized operational shipment records.';$('tabletitle').textContent=opportunity?'Activity-based candidates':'Company appearances';$('searchwrap').hidden=opportunity;
async function api(path){const r=await fetch(path,{credentials:'same-origin'});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}
function tr(values,target){const row=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=String(value??'');row.append(td)}target.append(row)}
async function run(){try{$('error').textContent='';$('note').textContent='Loading authorized records…';const p=new URLSearchParams();if($('company').value)p.set('company',$('company').value);if($('lob').value)p.set('lob',$('lob').value);if(!opportunity&&$('q').value)p.set('q',$('q').value);for(const key of ['origin','destination','branch','start','end'])if($(key).value)p.set(key,$(key).value);const data=await api((opportunity?'/api/opportunities':'/api/companies')+'?'+p);$('head').replaceChildren();$('rows').replaceChildren();tr(opportunity?['Company name','Appearances','Distinct lanes']:['Company name','Role','Appearances','Distinct lanes'],$('head'));for(const v of data.results){tr(opportunity?[v.name,v.appearances,v.lane_count]:[v.name,v.role,v.appearances,v.lanes],$('rows'))}if(!data.results.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=opportunity?3:4;cell.textContent='No records match the selected filters. Try broadening your date range or removing a filter.';cell.className='ai-empty';row.append(cell);$('rows').append(row)}$('note').textContent=(data.disclaimer||'Names are as recorded by ERP; spelling variants may represent the same legal entity.')+' Showing '+data.results.length+' records.'}catch(e){$('error').textContent=e.message}}
(async()=>{try{const u=await api('/auth/me');for(const [id,values] of [['company',u.companies],['lob',u.lobs]])for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)}const opts=await api('/api/dashboard/options');for(const key of ['origin','destination','branch'])for(const v of opts[key]||[]){const o=document.createElement('option');o.value=v;o.textContent=v;$(key).append(o)}await run()}catch(e){$('error').textContent='Please sign in from the Industry Explorer.'}})();$('search').onclick=run;$('refresh').onclick=run;$('export').onclick=()=>{const p=new URLSearchParams();p.set('kind',opportunity?'opportunities':'companies');for(const key of ['company','lob','origin','destination','branch','start','end'])if($(key).value)p.set(key,$(key).value);if(!opportunity&&$('q').value)p.set('q',$('q').value);location.href='/api/discovery/export?'+p.toString()};$('company').onchange=run;$('lob').onchange=run;for(const key of ['origin','destination','branch','start','end'])$(key).onchange=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};
</script></html>
